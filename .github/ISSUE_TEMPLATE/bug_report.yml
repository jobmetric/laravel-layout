name: Bug Report
description: Report an Issue or Bug with the Laravel Layout
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        We're sorry to hear you have a problem. Can you help us solve it by providing the following details.
  - type: textarea
    id: what-happened
    attributes:
      label: What Happened
      description: What did you expect to happen?
      placeholder: When I try to store a layout or get layout for a model, I get an incorrect result
    validations:
      required: true
  - type: textarea
    id: how-to-reproduce
    attributes:
      label: How to Reproduce
      description: How did this occur, please add any command or code used and provide a set of reliable steps if possible.
      placeholder: |
        Using Layout facade:
        use JobMetric\Layout\Facades\Layout;
        use JobMetric\Layout\Facades\ApplicationRegistry;
        
        ApplicationRegistry::register('shop', [
            'name' => 'Shop',
            'description' => 'E-commerce shop application',
        ]);
        
        $response = Layout::store([
            'name' => 'Main',
            'status' => true,
            'pages' => [
                ['application' => 'shop', 'page' => 'product'],
            ],
            'plugins' => [
                ['plugin_id' => 1, 'position' => 'header', 'ordering' => 1],
            ],
        ]);
        
        Or using HasLayout trait:
        use JobMetric\Layout\HasLayout;
        
        class Product extends Model
        {
            use HasLayout;
        }
        
        $layout = Layout::query()->create(['name' => 'Main', 'status' => true]);
        $product->storeLayout($layout, 'shop', null);
        $resolved = $product->getLayout('shop', null);
    validations:
      required: true
  - type: input
    id: expected-output
    attributes:
      label: Expected Output
      description: What output did you expect to receive?
      placeholder: "Layout should be stored successfully or getLayout should return the correct layout"
    validations:
      required: true
  - type: input
    id: actual-output
    attributes:
      label: Actual Output
      description: What output did you actually receive?
      placeholder: "Store or getLayout operation fails or throws an exception"
    validations:
      required: true
  - type: input
    id: package-version
    attributes:
      label: Package Version
      description: What version of Laravel Layout are you running? Please be as specific as possible
      placeholder: 1.0.0
    validations:
      required: true

